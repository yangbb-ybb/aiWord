<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端 viewport 配置 -->
    <!-- - width=device-width: 视口宽度跟随设备
         - initial-scale=1.0: 初始缩放 1:1
         - maximum-scale=1.0 + user-scalable=no: 禁止缩放(配合 vw 适配,避免用户缩放打乱布局)
         - viewport-fit=cover: 让页面延伸到 iPhone 刘海/灵动岛区域 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>aiWord H5</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
